name: Deploy to Lightsail
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'lib/**'
      - 'docker/prod/**'
      - 'drizzle/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Notify Discord (build start)
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"🚀 빌드 시작 SHA \`${{ steps.meta.outputs.sha }}\`\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/seophohoho/poposerver:${{ steps.meta.outputs.sha }}
            ghcr.io/seophohoho/poposerver:latest

      # 빌드 단계 실패(typecheck / test / docker build / ghcr push 등)를 명시적으로 알림.
      # if: failure()는 같은 job 안의 이전 step 실패를 감지 — Discord 시작 알림 자체가 실패한 경우는 제외(rare)
      - name: Notify Discord (build failure)
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ 빌드 실패 SHA \`${{ steps.meta.outputs.sha }}\` — Actions 로그 확인 필요 (@here)\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (deploy start)
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"📦 Lightsail 배포 시작 SHA \`${{ needs.build-and-push.outputs.sha }}\`\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/poposafari/server
            git pull --ff-only origin main
            ./scripts/deploy.sh ${{ needs.build-and-push.outputs.sha }}

      - name: Notify Discord (deploy success)
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ 배포 완료 SHA \`${{ needs.build-and-push.outputs.sha }}\`\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}

      - name: Notify Discord (deploy failure)
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ 배포 실패 SHA \`${{ needs.build-and-push.outputs.sha }}\` — 즉시 확인 필요 (@here)\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
