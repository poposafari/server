name: Deploy to Lightsail
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'lib/**'
      - 'docker/prod/**'
      - 'drizzle/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/seophohoho/poposerver:${{ steps.meta.outputs.sha }}
            ghcr.io/seophohoho/poposerver:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (start)
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"배포 시작 SHA \`${{ needs.build-and-push.outputs.sha }}\`\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd ~/poposafari/server
            ./scripts/deploy.sh ${{ needs.build-and-push.outputs.sha }}
      - name: Notify Discord (success)
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ 배포 완료 SHA \`${{ needs.build-and-push.outputs.sha }}\`\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
      - name: Notify Discord (failure)
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ 배포 실패 — 즉시 확인 필요 (@here)\"}" \
            ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
