version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - libs/database/.env.dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-seeder:
    build:
      context: .
      dockerfile: libs/database/Dockerfile
    environment:
      - NODE_ENV=DEV
    env_file:
      - libs/database/.env.dev
    command: npm run db:seed -w @poposerver/database
    depends_on:
      postgres:
        condition: service_healthy
