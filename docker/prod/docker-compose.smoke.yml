# 로컬(Mac) 스모크 부하용 오버레이 — Lean 6.
#
# 목적: prod docker-compose.yml의 **per-container mem_limit + OOM 가드(--max-old-space-size,
#       redis noeviction)를 그대로 강제한 채**, OOM 천장을 로컬에서 잰다.
#       base의 command(=힙 플래그)·deploy.resources(=메모리 한도)는 건드리지 않고 상속한다.
#
# base와 함께 사용 (run-smoke.sh가 대신 호출):
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml --env-file .env.smoke \
#     up -d --build postgres redis api socket worker flush
#   (nginx는 띄우지 않는다 — Mac에 없는 호스트 경로/SSL을 마운트하므로. 드라이버는 api:9000 / socket:9010 직격)
#
# 오버레이가 바꾸는 것만:
#   - 이미지: GHCR pull → 로컬 Dockerfile 빌드(arm64 Mac 네이티브)
#   - env_file: .env.prod → .env.smoke (!override = 리스트 교체. !reset은 제거라 NG)
#   - postgres 데이터: /mnt/pgdata(Linux 전용) → named volume pgdata_smoke (!override)
#   - api/socket 포트를 호스트 loopback에 publish (드라이버 접근용)
#
# ⚠️ 한계: 컨테이너 단위 mem_limit OOM은 충실히 재현되지만, 호스트 4GB '총량' 경합/swap은
#         재현 안 됨(Mac RAM이 큼). "어느 컨테이너가 먼저 자기 한도에 닿나"를 보는 용도.

# ⚠️ 컨테이너 이름/포트를 _smoke로 격리 — 로컬 dev 스택(pnpm db:dev)이 poposerver_postgres/redis
#    이름과 5432/6379 포트를 점유하므로 충돌 방지. 러너는 -p poposmoke 프로젝트로 띄운다.
#    컨테이너끼리는 여전히 service 이름(postgres/redis)으로 통신하므로 host 포트 리맵은 무관.
services:
  postgres:
    container_name: poposerver_smoke_postgres
    volumes: !override
      - pgdata_smoke:/var/lib/postgresql/data
    ports: !override
      - '127.0.0.1:55432:5432' # host push용(드라이버는 미사용). dev의 5432와 충돌 회피

  redis:
    container_name: poposerver_smoke_redis
    ports: !override
      - '127.0.0.1:56379:6379' # dev의 6379와 충돌 회피

  api:
    container_name: poposerver_smoke_api
    image: poposerver-smoke:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: !override
      - .env.smoke
    ports:
      - '127.0.0.1:9000:9000'

  socket:
    container_name: poposerver_smoke_socket
    image: poposerver-smoke:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: !override
      - .env.smoke
    ports:
      - '127.0.0.1:9010:9010'

  flush:
    container_name: poposerver_smoke_flush
    image: poposerver-smoke:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: !override
      - .env.smoke

  worker:
    container_name: poposerver_smoke_worker
    image: poposerver-smoke:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: !override
      - .env.smoke

volumes:
  pgdata_smoke:
