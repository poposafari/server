user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
# WS 1개당 커넥션 2개(클라이언트 + 업스트림)를 쓰므로 실질 WS 상한 = worker_processes × 이 값 ÷ 2.
# 1024 였을 때 2 × 1024 ÷ 2 = 1024 로 목표 동접과 정확히 겹쳤다. 4096 → 실질 4096.
events { worker_connections 4096; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # nginx 버전 숨김 (Server: nginx 헤더에서 버전 제거)
  server_tokens off;

  # 로그 포맷: $remote_addr는 Cloudflare 엣지 IP가 됨 → 진짜 클라이언트는 CF-Connecting-IP에서 추출
  log_format main '$remote_addr cf=$http_cf_connecting_ip - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  include /etc/nginx/conf.d/*.conf;
}
