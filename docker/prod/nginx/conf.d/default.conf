# HTTP(80) -> HTTPS(443) 리다이렉트
server {
  listen 80;
  server_name api.poposafari.net socket.poposafari.net poposafari.net www.poposafari.net;
  return 301 https://$host$request_uri;
}

# API: https://api.poposafari.net -> 172.28.0.10:9000 (fixed IP, no nginx reload on api recreate)
server {
  listen 443 ssl;
  http2 on;
  server_name api.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;

  # 점검 모드 판정: flag 파일 존재 시 1. deploy.sh/maintenance-on.sh가 touch/rm으로 토글.
  set $maintenance 0;
  if (-f /etc/nginx/flags/maintenance) { set $maintenance 1; }

  location / {
    # 점검 중이면 업스트림(Fastify)을 우회해 503을 반환한다.
    # 평소 CORS 헤더는 Fastify가 부여하는데, 우회 시 빠지면 브라우저가 cross-origin
    # 503/preflight를 차단해 클라이언트가 점검 상태를 인지하지 못한다 → @maintenance에서 직접 부여.
    if ($maintenance) {
      return 503;
    }

    proxy_pass http://172.28.0.10:9000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # Cloudflare 뒤이므로 진짜 클라 IP는 CF-Connecting-IP 헤더에서 추출
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;

    # API 응답은 캐시 금지 (세션 의존)
    add_header Cache-Control "no-store" always;
  }

  # 점검 503에 CORS 헤더를 직접 부여하고, preflight(OPTIONS)는 204로 통과시켜
  # 본 요청의 503을 브라우저가 읽을 수 있게 한다(클라가 점검 안내를 표시 가능).
  error_page 503 = @maintenance;
  location @maintenance {
    add_header Access-Control-Allow-Origin "https://poposafari.net" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    default_type application/json;
    return 503 '{"success":false,"code":"MAINTENANCE","message":"maintenance"}';
  }
}

# Socket: https://socket.poposafari.net -> 172.28.0.11:9010 (WebSocket, fixed IP, no nginx reload on socket recreate)
server {
  listen 443 ssl;
  http2 on;
  server_name socket.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;

  # 점검 모드: 새 WebSocket 연결도 차단(기존 활성 소켓은 컨테이너 재시작으로 끊김)
  if (-f /etc/nginx/flags/maintenance) { return 503; }

  location / {
    proxy_pass http://172.28.0.11:9010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;  # WebSocket idle 24h
  }
}

# 프론트 + 게임 에셋: https://poposafari.net -> 정적 파일 (루트 = /var/www/poposafari)
server {
  listen 443 ssl;
  http2 on;
  server_name poposafari.net www.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;

  root /var/www/poposafari;
  index index.html;

  # 정적 응답 공통 보안 헤더
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "SAMEORIGIN" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  # OAuth 팝업이 외부 origin(Google/Discord) 갔다 와도 window.opener / BroadcastChannel
  # 관계가 끊기지 않도록 same-origin-allow-popups 사용. 기본값(unsafe-none/same-origin)에선
  # cross-origin redirect chain을 거친 팝업의 opener가 null로 떨어진다.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # 점검 모드 노트:
  # - 정적 자원(index.html / JS 번들 / 에셋)은 점검 중에도 항상 200으로 서빙한다.
  # - 클라이언트가 정상 부팅한 뒤 첫 API 호출(api.poposafari.net)이 flag에 의해 503을 받고,
  #   ApiManager 인터셉터가 MaintenancePhase로 전환 → 콜드 방문/워밍업 세션 모두 동일 UI.
  # - 따라서 정적 블록에서는 flag 검사 / maintenance.html fallback을 사용하지 않는다.

  # Vite hash 박힌 청크 — 1년 immutable (URL이 hash로 변하므로 재검증 불필요)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # index.html — 매 접속마다 ETag 재검증 (새 hash 박힌 JS를 즉시 참조해야 함)
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # 마스터 데이터(밸런스 패치) — 1시간 캐시 (빌드 없이 hot-patch 가능)
  location /master/ {
    add_header Cache-Control "public, max-age=3600" always;
  }

  # multiatlas 자산 — JSON 내부에 image 파일명이 박혀있어 hash 불가, 1시간 캐시
  location /ui/pokemons/ {
    add_header Cache-Control "public, max-age=3600" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
