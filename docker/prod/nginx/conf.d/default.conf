# HTTP(80) -> HTTPS(443) 리다이렉트
server {
  listen 80;
  server_name api.poposafari.net socket.poposafari.net poposafari.net www.poposafari.net;
  return 301 https://$host$request_uri;
}

# API: https://api.poposafari.net -> api:9000
server {
  listen 443 ssl;
  server_name api.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  location / {
    proxy_pass http://api:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Socket: https://socket.poposafari.net -> socket:9010 (WebSocket)
server {
  listen 443 ssl;
  server_name socket.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  location / {
    proxy_pass http://socket:9010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }
}

# 프론트 + 게임 에셋: https://poposafari.net -> 정적 파일 (루트 = /var/www/poposafari)
server {
  listen 443 ssl;
  server_name poposafari.net www.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  root /var/www/poposafari;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=86400";  # 에셋 캐시 1일
  }
}