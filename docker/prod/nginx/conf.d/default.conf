# HTTP(80) -> HTTPS(443) 리다이렉트
server {
  listen 80;
  server_name api.poposafari.net socket.poposafari.net poposafari.net www.poposafari.net;
  return 301 https://$host$request_uri;
}

# API: https://api.poposafari.net -> 172.28.0.10:9000 (fixed IP, no nginx reload on api recreate)
server {
  listen 443 ssl;
  http2 on;
  server_name api.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;

  # 점검 모드: deploy.sh가 flag 파일을 touch/rm으로 토글
  if (-f /etc/nginx/flags/maintenance) { return 503; }

  location / {
    proxy_pass http://172.28.0.10:9000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # Cloudflare 뒤이므로 진짜 클라 IP는 CF-Connecting-IP 헤더에서 추출
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;

    # API 응답은 캐시 금지 (세션 의존)
    add_header Cache-Control "no-store" always;
  }
}

# Socket: https://socket.poposafari.net -> 172.28.0.11:9010 (WebSocket, fixed IP, no nginx reload on socket recreate)
server {
  listen 443 ssl;
  http2 on;
  server_name socket.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;

  # 점검 모드: 새 WebSocket 연결도 차단(기존 활성 소켓은 컨테이너 재시작으로 끊김)
  if (-f /etc/nginx/flags/maintenance) { return 503; }

  location / {
    proxy_pass http://172.28.0.11:9010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;  # WebSocket idle 24h
  }
}

# 프론트 + 게임 에셋: https://poposafari.net -> 정적 파일 (루트 = /var/www/poposafari)
server {
  listen 443 ssl;
  http2 on;
  server_name poposafari.net www.poposafari.net;
  ssl_certificate     /etc/nginx/ssl/origin.pem;
  ssl_certificate_key /etc/nginx/ssl/origin.key;

  root /var/www/poposafari;
  index index.html;

  # 정적 응답 공통 보안 헤더
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "SAMEORIGIN" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  # 점검 모드: 정적 페이지도 503으로 응답하고 별도 root의 maintenance.html을 본문으로 서빙
  if (-f /etc/nginx/flags/maintenance) { return 503; }
  error_page 503 = @maintenance;
  location @maintenance {
    root /var/www/maintenance;
    rewrite ^.*$ /maintenance.html break;
  }

  # Vite hash 박힌 청크 — 1년 immutable (URL이 hash로 변하므로 재검증 불필요)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # index.html — 매 접속마다 ETag 재검증 (새 hash 박힌 JS를 즉시 참조해야 함)
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # 마스터 데이터(밸런스 패치) — 1시간 캐시
  location /master/ {
    add_header Cache-Control "public, max-age=3600" always;
  }

  # 스프라이트/오디오/폰트 — 30일 캐시 (변경 빈도 낮음, 강제 갱신은 파일명 version suffix)
  location /ui/ {
    add_header Cache-Control "public, max-age=2592000" always;
  }
  location /audio/ {
    add_header Cache-Control "public, max-age=2592000" always;
  }
  location /font/ {
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
