# 프로파일링 모드: --cpu-prof, --trace-gc 추가. deploy.sh profile 또는
# compose -f docker-compose.yml -f docker-compose.profile.yml up 시 사용.
# 산출물: 컨테이너 내 /app 에 CPU.*.cpuprofile 생성, stderr에 GC 로그.
services:
  api:
    command: ['node', '--cpu-prof', '--trace-gc', '--heapsnapshot-near-heap-limit=1', 'dist/apps/api/main.js']
  socket:
    command: ['node', '--cpu-prof', '--trace-gc', '--heapsnapshot-near-heap-limit=1', 'dist/apps/socket/main.js']
  worker:
    command: ['node', '--cpu-prof', '--trace-gc', '--heapsnapshot-near-heap-limit=1', 'dist/apps/worker/main.js']
