# 프로드 2-vCPU 충실 재현 오버레이 (Lean 6 재실행용).
#
# 사용: run-smoke.sh EMULATE_2VCPU=1 이 base + smoke + 이 파일을 함께 올린다.
#
# 왜 cpuset인가:
#   프로드 Lightsail 4GB = 2 vCPU를 **전 컨테이너가 공유**한다(api가 한가하면 pg가 2코어까지 burst).
#   per-container `cpus: 2`는 컨테이너마다 2코어를 줘 합계가 과해져 틀린다.
#   모든 컨테이너를 같은 물리코어 0,1에 핀하면 → 2코어를 동적으로 공유 = 2-vCPU 박스와 동형.
#   부하 드라이버(호스트 Node)는 cpuset 밖(코어 2~7)에서 돌아 서버 2코어를 뺏지 않음
#   → 외부 클라이언트에서 때리는 것과 같아 오히려 더 충실.
#
# ⚠️ 한계: nginx는 smoke에서 미기동이라 그 몫(경량)만큼 앱에 유리. 메모리는 base mem_limit 그대로.
services:
  postgres:
    cpuset: '0,1'
  redis:
    cpuset: '0,1'
  api:
    cpuset: '0,1'
  socket:
    cpuset: '0,1'
  flush:
    cpuset: '0,1'
  worker:
    cpuset: '0,1'
