services:
  postgres:
    image: postgres:15-alpine
    container_name: poposerver_postgres
    restart: unless-stopped
    # docker bridge 내부 통신
    expose:
      - '5432'
    # 호스트 loopback에만 publish — DataGrip 등 SSH tunnel을 통한 DBA 접근용. 0.0.0.0 노출 금지
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      # Lightsail Block Storage 마운트(/mnt/pgdata, ext4) → 인스턴스 destroy해도 데이터 보존
      - /mnt/pgdata:/var/lib/postgresql/data
    networks:
      - poposerver_prod
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1536M # TODO(8-0): replace with measured baseline + 30~50% margin

  redis:
    image: redis:alpine
    container_name: poposerver_redis
    restart: unless-stopped
    expose:
      - '6379'
    # 호스트 loopback에만 publish — SSH tunnel 통한 DBA 접근용. 0.0.0.0 노출 금지
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --notify-keyspace-events Ex
    volumes:
      - redis_data:/data
    networks:
      - poposerver_prod
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M # TODO(8-0): replace with measured baseline + 30~50% margin

  api:
    image: ghcr.io/poposafari/server:${IMAGE_TAG:-latest}
    container_name: poposerver_api
    restart: unless-stopped
    command: ['node', '--heapsnapshot-near-heap-limit=1', 'dist/apps/api/main.js']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      poposerver_prod:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 400M # TODO(8-0): replace with measured baseline + 30~50% margin

  socket:
    image: ghcr.io/poposafari/server:${IMAGE_TAG:-latest}
    container_name: poposerver_socket
    restart: unless-stopped
    command: ['node', '--heapsnapshot-near-heap-limit=1', 'dist/apps/socket/main.js']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      poposerver_prod:
        ipv4_address: 172.28.0.11
    deploy:
      resources:
        limits:
          memory: 400M # TODO(8-0): replace with measured baseline + 30~50% margin

  flush:
    image: ghcr.io/poposafari/server:${IMAGE_TAG:-latest}
    container_name: poposerver_flush
    restart: unless-stopped
    command: ['node', '--heapsnapshot-near-heap-limit=1', 'dist/apps/flush/main.js']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      poposerver_prod:
        ipv4_address: 172.28.0.12
    deploy:
      resources:
        limits:
          memory: 350M # TODO(8-0): replace with measured baseline + 30~50% margin

  worker:
    image: ghcr.io/poposafari/server:${IMAGE_TAG:-latest}
    container_name: poposerver_worker
    restart: unless-stopped
    command: ['node', '--heapsnapshot-near-heap-limit=1', 'dist/apps/worker/main.js']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      poposerver_prod:
        ipv4_address: 172.28.0.13
    deploy:
      resources:
        limits:
          memory: 350M # TODO(8-0): replace with measured baseline + 30~50% margin

  nginx:
    image: nginx:alpine
    container_name: poposerver_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 점검 모드: deploy.sh가 ./flags/maintenance 파일을 touch/rm으로 토글
      - ./flags:/etc/nginx/flags:ro
      # 점검 페이지(503 응답 본문)
      - ./nginx/maintenance:/var/www/maintenance:ro
      # 프론트 빌드 결과 + 게임 에셋 (poposafari.net 루트)
      # client/.github/workflows/deploy.yml의 atomic swap 타겟과 동일 경로여야 함
      - /var/www/poposafari:/var/www/poposafari:ro
    depends_on:
      - api
      - socket
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 64M # TODO(8-0): replace with measured baseline + 30~50% margin

volumes:
  redis_data:

networks:
  poposerver_prod:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
