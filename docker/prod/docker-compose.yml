services:
  postgres:
    image: postgres:15-alpine
    container_name: poposerver_postgres
    restart: unless-stopped
    # docker bridge 내부 통신
    expose:
      - '5432'
    # 호스트 loopback에만 publish — DataGrip 등 SSH tunnel을 통한 DBA 접근용. 0.0.0.0 노출 금지
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      # Lightsail Block Storage 마운트(/mnt/pgdata, ext4) → 인스턴스 destroy해도 데이터 보존
      - /mnt/pgdata:/var/lib/postgresql/data
    networks:
      - poposerver_prod
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          # 세션이 Postgres로 이전됨(매 요청 SELECT 1). 워킹셋 여유 위해 1GB 유지.
          # TODO(9-0): 1주차 docker stats 실측 baseline + 30~50% margin으로 교체
          memory: 1024M

  # 통합 모놀리스: 한 프로세스가 REST(Fastify) + WebSocket(Socket.IO) + 게임 루프를 모두 담당.
  # nginx가 api. / socket. 서브도메인을 이 단일 upstream(172.28.0.10:9000)으로 라우팅한다.
  server:
    image: ghcr.io/seophohoho/poposerver:${IMAGE_TAG:-latest}
    container_name: poposerver_server
    restart: unless-stopped
    # OOM 안전: --max-old-space-size를 mem_limit(1024M)의 ~75%로. 4-in-1 통합이라 헤드룸 확대.
    command: ['node', '--max-old-space-size=768', '--heapsnapshot-near-heap-limit=1', 'dist/apps/server/main.js']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      poposerver_prod:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # 구 api(512)+socket(512)+worker(256)+flush(256) 4프로세스를 1로 통합 → heap 768 + 네이티브/버퍼 여유.
          # TODO(9-0): 1주차 실측 baseline + 30~50% margin으로 교체
          memory: 1024M

  nginx:
    image: nginx:alpine
    container_name: poposerver_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 점검 모드: deploy.sh가 ./flags/maintenance 파일을 touch/rm으로 토글
      - ./flags:/etc/nginx/flags:ro
      # 점검 페이지(503 응답 본문)
      - ./nginx/maintenance:/var/www/maintenance:ro
      # 프론트 빌드 결과 + 게임 에셋 (poposafari.net 루트)
      # client/.github/workflows/deploy.yml의 atomic swap 타겟과 동일 경로여야 함
      - /var/www/poposafari:/var/www/poposafari:ro
    depends_on:
      - server
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 64M # TODO(8-0): replace with measured baseline + 30~50% margin

networks:
  poposerver_prod:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
