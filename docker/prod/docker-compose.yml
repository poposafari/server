services:
  postgres:
    image: postgres:15-alpine
    container_name: poposerver_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:alpine
    container_name: poposerver_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: poposerver:latest
    container_name: poposerver_api
    restart: unless-stopped
    command: ['pnpm', 'exec', 'ts-node', '-r', 'tsconfig-paths/register', 'apps/api/main.ts']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 512M

  socket:
    image: poposerver:latest
    container_name: poposerver_socket
    restart: unless-stopped
    command: ['pnpm', 'exec', 'ts-node', '-r', 'tsconfig-paths/register', 'apps/socket/main.ts']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: poposerver:latest
    container_name: poposerver_worker
    restart: unless-stopped
    command: ['pnpm', 'exec', 'ts-node', '-r', 'tsconfig-paths/register', 'apps/worker/main.ts']
    env_file: .env.prod
    environment:
      NODE_ENV: PROD
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: poposerver_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 프론트 빌드 결과 + 게임 에셋 (poposafari.net 루트)
      - ./static:/var/www/poposafari:ro
    depends_on:
      - api
      - socket
    networks:
      - poposerver_prod
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pg_data:
  redis_data:

networks:
  poposerver_prod:
    driver: bridge
